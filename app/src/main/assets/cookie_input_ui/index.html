<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>newBV Cookie 远程输入</title>
<style>
  :root {
    --md-primary: #D3497E;
    --md-on-primary: #FFFFFF;
    --md-secondary-container: #FBE3EC;
    --md-on-secondary-container: #3B0A1E;
    --md-error: #BA1A1A;
    --md-surface: #FFFFFF;
    --md-on-surface: #1C1B1F;
    --md-on-surface-variant: #6B6470;
    --md-outline: #857988;
    --md-outline-variant: #E4DBE2;
    --md-surface-container: #F7EEF2;
    --md-inverse-surface: #322830;
    --md-inverse-on-surface: #F4EDF2;
    --md-shadow: rgba(0,0,0,0.20);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --md-primary: #FB7299;
      --md-on-primary: #3A0014;
      --md-secondary-container: #54293B;
      --md-on-secondary-container: #FBD8E4;
      --md-error: #FFB4AB;
      --md-surface: #14121A;
      --md-on-surface: #E6E0E6;
      --md-on-surface-variant: #CBC4CE;
      --md-outline: #978F9C;
      --md-outline-variant: #48414C;
      --md-surface-container: #211E26;
      --md-inverse-surface: #F4EDF2;
      --md-inverse-on-surface: #322830;
      --md-shadow: rgba(0,0,0,0.40);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--md-surface); color: var(--md-on-surface); -webkit-tap-highlight-color: transparent; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; }
  .md-toolbar { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 18px 16px 14px; }
  .md-toolbar .md-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--md-primary); color: var(--md-on-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
  .md-toolbar h1 { font-size: 18px; line-height: 24px; font-weight: 600; margin: 0; }
  .app-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--md-surface); }
  .tab-panel { display: none; }
  .tab-panel.active { display: flex; flex-direction: column; justify-content: center; min-height: 100%; padding: 20px 16px; }
  .panel-content { display: flex; flex-direction: column; gap: 20px; width: 100%; }
  .panel-hint { margin: 0; font-size: 13px; line-height: 20px; color: var(--md-on-surface-variant); }
  .md-field { flex: 1; min-width: 0; }
  .md-input {
    width: 100%; min-height: 160px; padding: 14px 16px;
    border: 1px solid var(--md-outline); border-radius: 12px;
    background: transparent; color: var(--md-on-surface);
    font-size: 15px; line-height: 22px; font-family: inherit;
    outline: none; caret-color: var(--md-primary); resize: vertical;
    transition: border-color 0.15s, border-width 0.15s, padding 0.15s;
    -webkit-appearance: none; appearance: none;
  }
  .md-input:focus { border-color: var(--md-primary); border-width: 2px; padding: 13px 15px; }
  .md-input::placeholder { color: var(--md-on-surface-variant); }
  .md-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 44px; padding: 0 24px;
    border: none; border-radius: 22px;
    font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.1px;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    position: relative; overflow: hidden;
    transition: box-shadow 0.2s, opacity 0.2s;
  }
  .md-btn::after { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity 0.2s; }
  .md-btn:hover::after { opacity: 0.08; }
  .md-btn:active::after { opacity: 0.12; }
  .md-btn:disabled { opacity: 0.45; cursor: default; }
  .md-btn-filled { background: var(--md-primary); color: var(--md-on-primary); box-shadow: 0 1px 2px var(--md-shadow); }
  .md-btn-filled:active { box-shadow: none; }
  .md-btn-tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .md-btn-full { width: 100%; }
  #file_uploader { display: none; }
  .file-name { font-size: 13px; color: var(--md-on-surface-variant); min-height: 18px; margin: 0; word-break: break-all; }
  .md-nav-bar {
    flex-shrink: 0; display: flex;
    background: var(--md-surface-container);
    border-top: 1px solid var(--md-outline-variant);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .md-nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 12px 0 16px; gap: 4px;
    cursor: pointer; user-select: none;
  }
  .md-nav-indicator { width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: transparent; transition: background 0.2s; }
  .md-nav-icon { width: 24px; height: 24px; fill: var(--md-on-surface-variant); transition: fill 0.2s; }
  .md-nav-label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; color: var(--md-on-surface-variant); transition: color 0.2s; }
  .md-nav-item.active .md-nav-indicator { background: var(--md-secondary-container); }
  .md-nav-item.active .md-nav-icon { fill: var(--md-on-secondary-container); }
  .md-nav-item.active .md-nav-label { color: var(--md-on-surface); font-weight: 700; }
  .md-snackbar-host { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
  .md-snackbar {
    position: absolute; bottom: 96px; left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    background: var(--md-inverse-surface);
    color: var(--md-inverse-on-surface);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 14px; line-height: 20px; letter-spacing: 0.25px;
    box-shadow: 0 3px 5px -1px var(--md-shadow), 0 6px 10px rgba(0,0,0,0.14), 0 1px 18px rgba(0,0,0,0.12);
    opacity: 0; transition: opacity 0.2s;
    white-space: pre-wrap;
  }
  .md-snackbar.visible { opacity: 1; }
  .md-snackbar.ok { outline: 1px solid rgba(126,226,168,0.6); }
  .md-snackbar.err { outline: 1px solid rgba(255,179,138,0.6); }
</style>
<body>
<div id="app">
  <header class="md-toolbar">
    <div class="md-logo">B</div>
    <h1>Cookie 远程输入</h1>
  </header>
  <div class="app-body">
    <div id="panel1" class="tab-panel active">
      <div class="panel-content">
        <p class="panel-hint">粘贴浏览器 Cookie（含 SESSDATA、bili_jct、DedeUserID）或 newBV / NeoBV 凭证 JSON，发送后将自动在电视上登录，结果会显示在本页。手机与电视需连接同一网络。</p>
        <div class="md-field">
          <textarea id="input" class="md-input" maxlength="65536" autocomplete="off" spellcheck="false" placeholder="在这里粘贴 Cookie 或凭证 JSON"></textarea>
        </div>
        <button id="send" class="md-btn md-btn-filled md-btn-full" onclick="submitInput()">发送并在电视上登录</button>
      </div>
    </div>
    <div id="panel2" class="tab-panel">
      <div class="panel-content">
        <p class="panel-hint">选择 newBV / NeoBV 导出的凭证文件（.json / .txt，小于 64 KB），导入后自动在电视上登录。</p>
        <input type="file" id="file_uploader" accept=".json,.txt,application/json,text/plain" />
        <button class="md-btn md-btn-tonal md-btn-full" onclick="document.getElementById('file_uploader').click()">选择凭证文件</button>
        <p id="file_name" class="file-name"></p>
        <button id="send_file" class="md-btn md-btn-filled md-btn-full" onclick="submitFile()" disabled>导入并在电视上登录</button>
      </div>
    </div>
  </div>
  <nav class="md-nav-bar">
    <div id="tab1" class="md-nav-item active" onclick="showPanel(1)">
      <div class="md-nav-indicator">
        <svg class="md-nav-icon" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </div>
      <span class="md-nav-label">粘贴凭证</span>
    </div>
    <div id="tab2" class="md-nav-item" onclick="showPanel(2)">
      <div class="md-nav-indicator">
        <svg class="md-nav-icon" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      </div>
      <span class="md-nav-label">文件导入</span>
    </div>
  </nav>
</div>
<div class="md-snackbar-host"><div id="snackbar" class="md-snackbar"></div></div>
<script>
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const sendFile = document.getElementById('send_file');
  const fileName = document.getElementById('file_name');
  const snackbar = document.getElementById('snackbar');
  let snackbarTimer = null;
  let fileContent = '';

  const tab = parseInt(new URLSearchParams(window.location.search).get('tab')) || 1;
  showPanel(tab);

  function showPanel(n) {
    for (const id of [1, 2]) {
      document.getElementById('panel' + id).classList.toggle('active', id === n);
      document.getElementById('tab' + id).classList.toggle('active', id === n);
    }
  }

  function show(text, cls, sticky) {
    snackbar.textContent = text;
    snackbar.className = 'md-snackbar visible' + (cls ? ' ' + cls : '');
    if (snackbarTimer) clearTimeout(snackbarTimer);
    if (!sticky) snackbarTimer = setTimeout(() => { snackbar.classList.remove('visible'); }, 5000);
  }

  async function submitToTv(value) {
    if (!value.trim()) { show('请输入 Cookie 或凭证 JSON', 'err'); return; }
    send.disabled = true; sendFile.disabled = true;
    show('正在发送并在电视上登录，请稍候…', '', true);
    try {
      const response = await fetch(new URL('input', location.href), {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: value, cache: 'no-store', signal: AbortSignal.timeout(30000)
      });
      const message = await response.text();
      if (response.ok) {
        show('登录成功：' + message, 'ok');
        input.value = ''; fileContent = ''; fileName.textContent = ''; sendFile.disabled = true;
      } else {
        show('失败：' + message, 'err');
      }
    } catch {
      show('发送失败，请检查网络并确认电视仍在 Cookie 登录页', 'err');
    } finally {
      send.disabled = false;
    }
  }

  function submitInput() { submitToTv(input.value); }

  function submitFile() { submitToTv(fileContent); }

  document.getElementById('file_uploader').addEventListener('change', async event => {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 65536) { show('文件过大，请选择小于 64 KB 的凭证文件', 'err'); event.target.value = ''; return; }
    try {
      fileContent = await file.text();
      fileName.textContent = '已选择：' + file.name;
      sendFile.disabled = false;
      show('文件已导入，点击「导入并在电视上登录」');
    } catch { show('无法读取文件，请重新选择', 'err'); }
  });

  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.ctrlKey) { this.blur(); submitInput(); } });
</script>
</body>
</html>
