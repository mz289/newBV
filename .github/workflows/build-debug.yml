name: Build Debug

on:
  push:
    branches:
      - mods
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode/versionName 由 git rev-list 推导，需要完整历史
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 不依赖默认 ~/.android 路径：AGP 可能优先使用 XDG_CONFIG_HOME。
      # 缺少固定密钥时直接失败，绝不能发布自动生成临时签名的 APK。
      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_B64" || { echo "Missing DEBUG_KEYSTORE_B64" >&2; exit 1; }
          NEWBV_CI_KEYSTORE="$RUNNER_TEMP/newbv-ci-signing.keystore"
          echo "NEWBV_CI_KEYSTORE=$NEWBV_CI_KEYSTORE" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$NEWBV_CI_KEYSTORE"
          test -s "$NEWBV_CI_KEYSTORE"
          keytool -exportcert -keystore "$NEWBV_CI_KEYSTORE" -storepass android \
            -alias androiddebugkey -file "$RUNNER_TEMP/newbv-signing.cer"
          sha256sum "$RUNNER_TEMP/newbv-signing.cer" | cut -d ' ' -f 1 > "$RUNNER_TEMP/newbv-signing.sha256"
          echo "Expected signing certificate SHA-256: $(cat "$RUNNER_TEMP/newbv-signing.sha256")"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test signing verification
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build debug & release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APK signing certificates
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          python3 .github/scripts/verify_apk_signatures.py \
            --apksigner "$APKSIGNER" \
            --expected "$(cat "$RUNNER_TEMP/newbv-signing.sha256")" \
            app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newBV_apks_${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

      # 参考 husi 的发布方式：每次构建发布为独立版本标签（v<versionName>）的
      # 预发布 Release，历史版本保留可回滚；同一标签重建时 --clobber 覆盖附件。
      # 不用 Actions 产物作 App 更新源——其 zip 下载接口需鉴权，App 无法匿名拉取；
      # 预发布 Release 可匿名下载，App 内更新检查（接收预发布开关）直接消费。
      - name: Read version from build output
        id: version
        run: |
          META=app/build/outputs/apk/debug/output-metadata.json
          echo "versionCode=$(jq -r '.elements[0].versionCode' "$META")" >> "$GITHUB_OUTPUT"
          echo "versionName=$(jq -r '.elements[0].versionName' "$META")" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        if: github.repository == 'mz289/newBV'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          TAG="v$VERSION_NAME"
          DEBUG_APK="app/build/outputs/apk/debug/newBV_${VERSION_CODE}_${VERSION_NAME}_debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/newBV_${VERSION_CODE}_${VERSION_NAME}_release.apk"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEBUG_APK" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$DEBUG_APK" "$RELEASE_APK" \
              --title "newBV $VERSION_NAME" \
              --generate-notes \
              --prerelease
          fi
