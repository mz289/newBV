name: Build APKs

on:
  push:
    branches:
      - mods
  workflow_dispatch:

permissions:
  contents: write

# 连续推送时只构建最新提交，取消进行中的旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode/versionName 由 git rev-list 推导，需要完整历史
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 不依赖默认 ~/.android 路径：AGP 可能优先使用 XDG_CONFIG_HOME。
      # 缺少固定密钥时直接失败，绝不能发布自动生成临时签名的 APK。
      - name: Restore fixed signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .signing
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > .signing/newbv.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newBV_apk_${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

      # 参考 husi 的发布方式：每次构建发布为独立版本标签（v<versionName>）的
      # 预发布 Release，历史版本保留可回滚；同一标签重建时 --clobber 覆盖附件。
      # 不用 Actions 产物作 App 更新源——其 zip 下载接口需鉴权，App 无法匿名拉取；
      # 预发布 Release 可匿名下载，App 内更新检查（接收预发布开关）直接消费。
      - name: Read version from build output
        id: version
        run: |
          META=app/build/outputs/apk/release/output-metadata.json
          echo "versionCode=$(jq -r '.elements[0].versionCode' "$META")" >> "$GITHUB_OUTPUT"
          echo "versionName=$(jq -r '.elements[0].versionName' "$META")" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        if: github.repository == 'mz289/newBV'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          TAG="v$VERSION_NAME"
          RELEASE_APK="app/build/outputs/apk/release/newBV_${VERSION_CODE}_${VERSION_NAME}_release.apk"
          test -f "$RELEASE_APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" \
              --title "newBV $VERSION_NAME" \
              --generate-notes \
              --prerelease
          fi
